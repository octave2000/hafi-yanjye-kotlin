org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# One JVM for Gradle and the Kotlin compiler: this computer is short on memory.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=1800000

# Where the engine lives. Debug builds talk to an engine on this computer
# (10.0.2.2 is "the host" from the Android emulator); override on the command
# line for a real phone: ./gradlew installDebug -PdebugApiUrl=http://192.168.1.20:3100
debugApiUrl=http://10.0.2.2:3100
# Release builds need the public engine URL (https). Set it before the first release.
releaseApiUrl=
# The web app, for links people share (public CVs). Set the public https address before the first release.
webUrl=http://localhost:5173
